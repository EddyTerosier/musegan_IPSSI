version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./reports:/app/reports
      - ./third_party/musegan/exp:/app/third_party/musegan/exp
      - model_cache:/app/models
    environment:
      - PYTHONPATH=/app:/app/third_party/musegan/src
    command: python -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:18-alpine
    working_dir: /app/apps/web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  model_cache:
